name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ffamato app
        run: |
          curl -k -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          https://ffamato.streamlit.app/?keepalive=1 || true
